name: CI

on:
  push:
    branches: [main]
  # Unfiltered on purpose: feature-branch work must run CI as soon as a pull
  # request opens, whatever it targets. Restricting this to main leaves branch
  # work uncovered until branch protection forces pull requests.
  pull_request:
  # Weekly, Tuesday 04:00 UTC. This exists for the vulncheck job: standard
  # library advisories are published against a Go version already pinned in
  # go.mod, so they appear without anything in this repository changing. Five
  # such advisories landed between 2026-08-05 and 2026-08-15 and were caught
  # only because a release happened to be pushed. On a quiet repository that
  # is an unbounded window. The other jobs run too, which also catches
  # toolchain and dependency drift.
  schedule:
    - cron: '0 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -v ./...
      - run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -tags e2e -race ./test/e2e/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Verify dependencies are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # v2 is the maintained line; the v1 series is end-of-life. Note the /v2
      # module path — installing the v1 path silently gets you a v1 binary,
      # which cannot parse the v2 .golangci.yml schema.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: golangci-lint run ./...

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: adtp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run postgres integration tests
        env:
          ADTP_TEST_POSTGRES_DSN: postgres://postgres:testpass@localhost:5432/adtp_test
        run: go test -v -tags integration ./store/postgres/...

  # Reports newly-disclosed CVEs in dependencies, so this job can turn red
  # without any change to this repository. Keep it OFF the required-checks
  # list in branch protection so an upstream advisory cannot block a merge.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
